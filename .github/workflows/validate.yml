name: Validate generated StarLang consumer
on:
  pull_request:
  push:
    branches: [master, 'codex/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - name: Verify immutable upstream release
        run: python3 scripts/sync-starintel-schema.py
      - name: Build full UI and validate generated bindings, forms and real HTTP transport
        run: nix flake check -L
